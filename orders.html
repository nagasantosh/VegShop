<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delivery Schedule</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      max-width: 1200px;
      margin: auto;
    }

    h1, h2, h3 {
      margin-top: 24px;
    }

    input[type="date"] {
      padding: 8px;
      font-size: 16px;
      width: 100%;
      max-width: 250px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }

    th {
      background: #f4f4f4;
    }

    .message {
      margin-top: 16px;
      font-weight: bold;
      color: #c00;
    }

    .mobile-block {
      margin-top: 24px;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 10px;
      }

      td {
        border: none;
        padding: 6px 0;
      }

      td::before {
        font-weight: bold;
        display: block;
      }
    }
  </style>
</head>
<body>

<h1>Delivery Schedule</h1>

<label>
  Select Delivery Date:
  <input type="date" id="datePicker" />
</label>

<div id="noOrders" class="message" style="display:none;">
  No orders for the selected date.
</div>

<h2>Total Quantity per Item</h2>
<table>
  <thead>
    <tr><th>Item</th><th>Total Quantity</th><th>Unit</th></tr>
  </thead>
  <tbody id="itemSummary"></tbody>
</table>

<h2>Orders Grouped by Mobile Number</h2>
<div id="mobileGroups"></div>

<script>
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdjwBZPsWhEFvKDlbWK8-XK1lxE3jtpLNtc8kfv9OdkZHxIA-oIMohsQPhjwL-SmidxXC5xGJXsrCJ/pub?gid=135295189&single=true&output=csv";

let data = [];

fetch(CSV_URL)
  .then(r => r.text())
  .then(text => data = csvToObjects(text));

function csvToObjects(csv) {
  const lines = csv.trim().split(/\r?\n/);
  const headers = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).map(line => {
    const values = line.split(",");
    const obj = {};
    headers.forEach((h, i) => obj[h] = (values[i] || "").trim());
    return obj;
  });
}

document.getElementById("datePicker").addEventListener("change", e => {
  renderForDate(e.target.value);
});

function normalizeDate(dateStr) {
  if (!dateStr) return "";
  if (dateStr.includes("/")) {
    const [d, m, y] = dateStr.split("/");
    return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  return dateStr;
}

function renderForDate(date) {
  const rows = data.filter(r => normalizeDate(r.deliveryDate) === date);

  if (rows.length === 0) {
    document.getElementById("noOrders").style.display = "block";
    document.getElementById("itemSummary").innerHTML = "";
    document.getElementById("mobileGroups").innerHTML = "";
    return;
  }

  document.getElementById("noOrders").style.display = "none";
  renderItemTotals(rows);
  renderGroupedByMobile(rows);
}

function renderItemTotals(rows) {
  const map = {};
  rows.forEach(r => {
    if (!map[r.item]) map[r.item] = { qty: 0, unit: r.unit };
    map[r.item].qty += Number(r.quantity || 0);
  });

  const tbody = document.getElementById("itemSummary");
  tbody.innerHTML = "";
  Object.entries(map).forEach(([item, info]) => {
    tbody.innerHTML += `
      <tr>
        <td>${item}</td>
        <td>${info.qty}</td>
        <td>${info.unit}</td>
      </tr>
    `;
  });
}

function renderGroupedByMobile(rows) {
  const mobileMap = {};

  rows.forEach(r => {
    const mobile = r.mobileNumber;
    if (!mobileMap[mobile]) mobileMap[mobile] = {};
    if (!mobileMap[mobile][r.item]) {
      mobileMap[mobile][r.item] = { qty: 0, unit: r.unit };
    }
    mobileMap[mobile][r.item].qty += Number(r.quantity || 0);
  });

  const container = document.getElementById("mobileGroups");
  container.innerHTML = "";

  Object.entries(mobileMap).forEach(([mobile, items]) => {
    const div = document.createElement("div");
    div.className = "mobile-block";

    div.innerHTML = `
      <h3>Mobile: ${mobile}</h3>
      <table>
        <thead>
          <tr><th>Item</th><th>Total Quantity</th><th>Unit</th></tr>
        </thead>
        <tbody>
          ${Object.entries(items).map(([item, info]) => `
            <tr>
              <td>${item}</td>
              <td>${info.qty}</td>
              <td>${info.unit}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;

    container.appendChild(div);
  });
}
</script>

</body>
</html>
