<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delivery Schedule</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input[type="date"] { padding: 6px; font-size: 16px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 8px; vertical-align: top; }
    th { background: #f4f4f4; }
    .message { margin-top: 15px; font-weight: bold; color: #c00; }
    .mobile-block { margin-top: 20px; }
  </style>
</head>
<body>

<h1>Delivery Schedule</h1>

<label>
  Select Delivery Date:
  <input type="date" id="datePicker" />
</label>

<div id="noOrders" class="message" style="display:none;">
  No orders for the selected date.
</div>

<h2>1. Total Quantity per Item</h2>
<table>
  <thead>
    <tr><th>Item</th><th>Total Quantity</th><th>Unit</th></tr>
  </thead>
  <tbody id="itemSummary"></tbody>
</table>

<h2>2. Orders Grouped by Mobile Number</h2>
<div id="mobileGroups"></div>

<script>
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdjwBZPsWhEFvKDlbWK8-XK1lxE3jtpLNtc8kfv9OdkZHxIA-oIMohsQPhjwL-SmidxXC5xGJXsrCJ/pub?gid=135295189&single=true&output=csv";

let data = [];

fetch(CSV_URL)
  .then(r => r.text())
  .then(text => data = csvToObjects(text));

function csvToObjects(csv) {
  const lines = csv.trim().split(/\r?\n/);
  const headers = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).map(line => {
    const values = line.split(",");
    const obj = {};
    headers.forEach((h, i) => obj[h] = (values[i] || "").trim());
    return obj;
  });
}

document.getElementById("datePicker").addEventListener("change", e => {
  const selectedDate = e.target.value;
  renderForDate(selectedDate);
});

function renderForDate(date) {
  const rows = data.filter(r => normalizeDate(r.deliveryDate) === date);

  const noOrders = document.getElementById("noOrders");
  if (rows.length === 0) {
    noOrders.style.display = "block";
    document.getElementById("itemSummary").innerHTML = "";
    document.getElementById("mobileGroups").innerHTML = "";
    return;
  } else {
    noOrders.style.display = "none";
  }

  renderItemTotals(rows);
  renderGroupedByMobile(rows);
}

function normalizeDate(dateStr) {
  // Handles formats like DD/MM/YYYY or YYYY-MM-DD
  if (dateStr.includes("/")) {
    const [d, m, y] = dateStr.split("/");
    return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  return dateStr;
}

function renderItemTotals(rows) {
  const map = {};
  rows.forEach(r => {
    if (!map[r.item]) {
      map[r.item] = { qty: 0, unit: r.unit };
    }
    map[r.item].qty += Number(r.quantity || 0);
  });

  const tbody = document.getElementById("itemSummary");
  tbody.innerHTML = "";
  Object.entries(map).forEach(([item, info]) => {
    tbody.innerHTML += `
      <tr>
        <td>${item}</td>
        <td>${info.qty}</td>
        <td>${info.unit}</td>
      </tr>
    `;
  });
}

function renderGroupedByMobile(rows) {
  const groups = {};
  rows.forEach(r => {
    if (!groups[r.mobileNumber]) groups[r.mobileNumber] = [];
    groups[r.mobileNumber].push(r);
  });

  const container = document.getElementById("mobileGroups");
  container.innerHTML = "";

  Object.entries(groups).forEach(([mobile, items]) => {
    const div = document.createElement("div");
    div.className = "mobile-block";
    div.innerHTML = `
      <h3>Mobile: ${mobile}</h3>
      <table>
        <thead>
          <tr><th>Item</th><th>Quantity</th><th>Unit</th></tr>
        </thead>
        <tbody>
          ${items.map(i => `
            <tr>
              <td>${i.item}</td>
              <td>${i.quantity}</td>
              <td>${i.unit}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
    container.appendChild(div);
  });
}
</script>

</body>
</html>
